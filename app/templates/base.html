<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}学生管理系统 V2{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ai_chat.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark">SMS</span>
        <div class="brand-copy">
          <strong>学生管理系统 V2</strong>
          <small>Dashboard & Student Workspace</small>
        </div>
      </div>
      {% if current_user %}
      <div class="topbar-user" data-current-role="{{ current_user.role }}">
        <span data-current-username>{{ current_user.username }}</span>
        <span data-current-role-label>{{ current_user.role }}</span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="secondary">退出</button>
        </form>
      </div>
      {% endif %}
    </header>

    <div class="app-layout">
      <aside class="sidebar" aria-label="主导航">
        <div class="sidebar-title">系统导航</div>
        <nav class="sidebar-nav">
          <a
            href="{{ url_for('pages.dashboard_page') }}"
            class="sidebar-link {% if active_page == 'dashboard' %}is-active{% endif %}"
          >
            <span class="sidebar-link-mark"></span>
            首页概览
          </a>
          <a
            href="{{ url_for('pages.students_page') }}"
            class="sidebar-link {% if active_page == 'students' %}is-active{% endif %}"
          >
            <span class="sidebar-link-mark"></span>
            学生管理
          </a>
        </nav>
      </aside>

      <div class="content-area">
        {% block body %}{% endblock %}
      </div>
    </div>

    {% include "_ai_chat.html" %}
    <script src="{{ url_for('static', filename='js/ai_chat.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
