[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-management-system-v2"
version = "0.1.0"
description = "Student Management System V2 foundation"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "mcp>=1.27,<2",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*", "mcp_client*"]
