{% extends "base.html" %}

{% block title %}学生管理 - 学生信息管理系统{% endblock %}

{% block content %}
<section class="page-card">
    <div class="page-header">
        <div>
            <span class="section-tag">学生信息管理</span>
            <h2>学生管理页面</h2>
            <p>支持学生数据搜索、新增、编辑、导入、导出以及批量删除。</p>
        </div>
    </div>

    <form class="toolbar" id="searchForm">
        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="输入学号、姓名、专业、成绩、电话或邮箱"
            aria-label="搜索学生"
        >
        <button type="submit" class="btn btn-secondary" id="searchButton">搜索</button>
        <button type="button" class="btn btn-secondary" id="resetButton">重置</button>
        <button type="button" class="btn btn-secondary" id="importCsvButton">导入 CSV/Excel</button>
        <button type="button" class="btn btn-secondary" id="exportCsvButton">导出 CSV</button>
        <button type="button" class="btn btn-secondary" id="exportExcelButton">导出 Excel</button>
        <button type="button" class="btn btn-danger" id="batchDeleteButton" disabled>批量删除</button>
        <button type="button" class="btn btn-primary" id="addStudentButton">新增学生</button>
        <input type="file" id="importFileInput" accept=".csv,.xlsx,.xls" hidden>
    </form>

    <div class="batch-actions">
        <span id="selectedCount">已选择 0 项</span>
        <span id="searchResultCount"></span>
        <span>导入支持字段：学号、姓名、性别、年龄、专业、成绩、电话、邮箱</span>
    </div>

    <div class="table-wrap">
        <table class="data-table" id="studentsTable">
            <thead>
                <tr>
                    <th class="checkbox-column">
                        <input type="checkbox" id="selectAllStudents" aria-label="选择当前显示的全部学生">
                    </th>
                    <th data-sort-key="id" aria-sort="none" class="sortable-th">
                        ID <button type="button" class="sort-btn" aria-label="按 ID 排序">↕️</button>
                    </th>
                    <th data-sort-key="student_number" aria-sort="none" class="sortable-th">
                        学号 <button type="button" class="sort-btn" aria-label="按学号排序">↕️</button>
                    </th>
                    <th data-sort-key="name" aria-sort="none" class="sortable-th">
                        姓名 <button type="button" class="sort-btn" aria-label="按姓名排序">↕️</button>
                    </th>
                    <th data-sort-key="gender" aria-sort="none" class="sortable-th">
                        性别 <button type="button" class="sort-btn" aria-label="按性别排序">↕️</button>
                    </th>
                    <th data-sort-key="age" aria-sort="none" class="sortable-th">
                        年龄 <button type="button" class="sort-btn" aria-label="按年龄排序">↕️</button>
                    </th>
                    <th data-sort-key="major" aria-sort="none" class="sortable-th">
                        专业 <button type="button" class="sort-btn" aria-label="按专业排序">↕️</button>
                    </th>
                    <th data-sort-key="grade" aria-sort="none" class="sortable-th">
                        成绩 <button type="button" class="sort-btn" aria-label="按成绩排序">↕️</button>
                    </th>
                    <th>电话</th>
                    <th>邮箱</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="studentsTableBody">
                <tr>
                    <td colspan="11" class="empty-cell">正在加载学生数据...</td>
                </tr>
            </tbody>
        </table>
    </div>


    <div class="pagination" id="studentsPagination">
    <div class="pagination-summary" id="paginationSummary">
        第 1 页，共 1 页
    </div>

    <div class="pagination-controls">
        <button
            type="button"
            class="btn btn-secondary"
            id="firstPageButton"
        >
            首页
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            id="previousPageButton"
        >
            上一页
        </button>

        <span id="pageNumberButtons"></span>

        <button
            type="button"
            class="btn btn-secondary"
            id="nextPageButton"
        >
            下一页
        </button>

        <button
            type="button"
            class="btn btn-secondary"
            id="lastPageButton"
        >
            末页
        </button>
    </div>
</div>
</section>

<div class="modal" id="studentModal">
    <div class="modal-content">
        <button type="button" class="icon-button modal-close" id="closeModalButton" aria-label="关闭">&times;</button>
        <h3 id="modalTitle">新增学生</h3>
        <form id="studentForm">
            <input type="hidden" id="studentId">

            <div class="form-grid">
                <div class="form-group">
                    <label for="studentNumber">学号</label>
                    <input type="text" id="studentNumber" required>
                </div>
                <div class="form-group">
                    <label for="studentName">姓名</label>
                    <input type="text" id="studentName" required>
                </div>
                <div class="form-group">
                    <label for="studentGender">性别</label>
                    <select id="studentGender" required>
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="studentAge">年龄</label>
                    <input type="number" id="studentAge" min="1" required>
                </div>
                <div class="form-group">
                    <label for="studentMajor">专业</label>
                    <input type="text" id="studentMajor" required>
                </div>
                <div class="form-group">
                    <label for="studentGrade">成绩</label>
                    <input type="text" id="studentGrade" required>
                </div>
                <div class="form-group">
                    <label for="studentPhone">电话</label>
                    <input type="text" id="studentPhone">
                </div>
                <div class="form-group">
                    <label for="studentEmail">邮箱</label>
                    <input type="email" id="studentEmail">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelModalButton">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script 
    src="{{ url_for('static', filename='js/students.js', v='20260716b') }}"
    defer>
</script>
{% endblock %}
