<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学生信息管理系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260714a') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="brand-mark">S</span>
                <h1>学生信息管理系统</h1>
                <p>Student Management System</p>
            </div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="loginUsername">用户名</label>
                    <input
                        type="text"
                        id="loginUsername"
                        name="username"
                        class="form-control"
                        placeholder="请输入用户名"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        class="form-control"
                        placeholder="请输入密码"
                        required
                    >
                </div>

                <div class="login-error" id="loginErrorMessage" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
                    登 录
                </button>
            </form>

            <div class="login-footer">
                <p>默认管理员: admin / admin123</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js', v='20260720a') }}" defer></script>
</body>
</html>
